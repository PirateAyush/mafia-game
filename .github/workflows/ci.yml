name: CI

# Run on every push to master and on every pull request.
on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Redis for the store tests, running in a container next to the job.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      MAFIA_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Build the image
        run: docker build --tag mafia-game:ci .

  deploy:
    name: Deploy to server
    # Only after both checks pass, and only for pushes to master (merged PRs), never for PRs.
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # If two merges land close together, deploy them one after the other, never at once.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ayush-mafia.duckdns.org
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server ignores any command we send: this key can only run the deploy.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "ubuntu@$HOST"

      - name: Check the live site
        run: >-
          curl --fail --silent --show-error
          --retry 10 --retry-delay 3 --retry-all-errors
          https://ayush-mafia.duckdns.org/healthz
