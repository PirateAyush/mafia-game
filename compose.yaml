# Runs the whole production setup: the app, Redis, and Caddy in front.
# On your laptop:  HTTP_PORT=8080 HTTPS_PORT=8443 docker compose up --build -d
# On the server, settings come from a .env file next to this one.

services:
  app:
    build: .
    image: mafia-game:local
    environment:
      MAFIA_REDIS_URL: redis://redis:6379/0  # "redis" is the service name below
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # write every change to disk
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data  # HTTPS certificates live here; keep them across restarts
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
